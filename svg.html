<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    .box {
  width: 100px;
  height: 100px;
  position: absolute;
  top: 50px;
  left: 50px;
}

.box-1 {
  background-color: lightblue;
  z-index: 1; /* This box will appear on top of Box 2 */
}

.box-2 {
  background-color: lightcoral;
  top: 80px;
  left: 80px;
  z-index: 0; /* This box will appear underneath Box 1 */
}
</style>
</head>
<body>
    <div class="box box-1">Box 1</div>
    <div class="box box-2">Box 2</div>
</body>
</html>
